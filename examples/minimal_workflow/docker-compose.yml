services:
  redis:
    image: redis:7.2
    container_name: hea-minimal-redis
    ports:
      - "6380:6379"

  minio:
    image: minio/minio:latest
    container_name: hea-minimal-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  minio_data:
